name: Сборка APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Собрать оба приложения
        run: gradle :remote:assembleRelease :receiver:assembleRelease --no-daemon

      - name: Переименовать APK
        run: |
          mkdir -p out
          cp remote/build/outputs/apk/release/remote-release.apk   out/pult-telefon.apk
          cp receiver/build/outputs/apk/release/receiver-release.apk out/priemnik-pleer.apk

      - name: Выложить APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk
